services:
  kb-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: se-kb-api:${SE_KB_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    init: true
    environment:
      KB_READ_KEYS: ${KB_READ_KEYS:?set KB_READ_KEYS in the process environment}
      KB_ADMIN_KEYS: ${KB_ADMIN_KEYS:?set KB_ADMIN_KEYS in the process environment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL: ${MODEL:-}
      BASE_URL: ${BASE_URL:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
    volumes:
      - kb_data:/app/data
      - kb_cache:/app/cache
      - kb_output:/app/output
      - kb_logs:/app/logs
      - kb_index:/app/se_kb
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [kb-net]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    profiles: [gateway]
    restart: unless-stopped
    read_only: true
    depends_on:
      kb-api: {condition: service_healthy}
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    networks: [kb-net]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  kb_data:
  kb_cache:
  kb_output:
  kb_logs:
  kb_index:

networks:
  kb-net:
    driver: bridge
    internal: true

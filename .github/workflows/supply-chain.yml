name: supply-chain

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 2"

permissions:
  contents: read

jobs:
  audit-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv sync --frozen --extra api
      - run: uvx pip-audit -r requirements-prod.txt --require-hashes --format json --output security-audit.json
      - run: uvx cyclonedx-py requirements requirements-prod.txt --output-file sbom.cdx.json
      - run: uvx pip-licenses --format=json --output-file=licenses.json
      - run: uv run python scripts/check_security.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-evidence
          path: |
            security-audit.json
            sbom.cdx.json
            licenses.json
          retention-days: 30
